[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src/agent_tools
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

markers =
    parametrize: mark test to run with multiple parameter sets

# Minimum coverage threshold (95%)
[coverage:run]
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
